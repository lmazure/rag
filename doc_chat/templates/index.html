<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Squash Documentation Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .loading {
            display: none;
        }
        .sources {
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Squash Documentation Chat</h1>
        
        <div class="mb-4">
            <button id="ingestBtn" class="btn btn-primary">Ingest Documentation</button>
            <span id="ingestStatus" class="ms-3"></span>
        </div>

        <div class="mb-3">
            <label for="query" class="form-label">Ask a question about Squash:</label>
            <input type="text" class="form-control" id="query" placeholder="Enter your question...">
        </div>
        
        <button id="submitBtn" class="btn btn-success mb-4">Ask Question</button>
        
        <div class="loading" id="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="response" class="mt-4"></div>
    </div>

    <script>
        document.getElementById('ingestBtn').addEventListener('click', async () => {
            const ingestStatus = document.getElementById('ingestStatus');
            const ingestBtn = document.getElementById('ingestBtn');
            
            ingestBtn.disabled = true;
            ingestStatus.textContent = 'Ingesting documentation...';
            
            try {
                const response = await fetch('/ingest', {
                    method: 'POST'
                });
                const data = await response.json();
                ingestStatus.textContent = data.message;
            } catch (error) {
                ingestStatus.textContent = 'Error ingesting documentation';
                console.error(error);
            } finally {
                ingestBtn.disabled = false;
            }
        });

        document.getElementById('submitBtn').addEventListener('click', async () => {
            const query = document.getElementById('query').value;
            const loading = document.getElementById('loading');
            const response = document.getElementById('response');
            const submitBtn = document.getElementById('submitBtn');
            
            if (!query) return;
            
            loading.style.display = 'block';
            response.innerHTML = '';
            submitBtn.disabled = true;
            
            try {
                const res = await fetch('/query', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ query })
                });
                
                const data = await res.json();
                
                response.innerHTML = `
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title">Answer:</h5>
                            <p class="card-text">${data.answer}</p>
                            <div class="sources">
                                <strong>Sources:</strong><br>
                                ${data.sources.map(source => `<a href="${source}" target="_blank">${source}</a>`).join('<br>')}
                            </div>
                        </div>
                    </div>
                `;
            } catch (error) {
                response.innerHTML = '<div class="alert alert-danger">Error getting response</div>';
                console.error(error);
            } finally {
                loading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
